name: Build current-state ITS patch DLLs

on:
  workflow_dispatch:
  push:
    branches:
      - its-current-state-upstream-2026-10-06

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore application
        run: dotnet restore LenovoLegionToolkit.WPF/LenovoLegionToolkit.WPF.csproj

      - name: Publish matching application assemblies
        run: dotnet publish LenovoLegionToolkit.WPF/LenovoLegionToolkit.WPF.csproj -c Release -o build-patch /p:DebugType=None /p:DebugSymbols=false

      - name: Verify assembly identities
        shell: powershell
        run: |
          $dllPaths = @(
            (Join-Path $PWD "build-patch/LenovoLegionToolkit.Lib.dll"),
            (Join-Path $PWD "build-patch/Lenovo Legion Toolkit.dll")
          )

          foreach ($dllPath in $dllPaths) {
            if (-not (Test-Path $dllPath)) {
              throw "Expected DLL not found: $dllPath"
            }

            $assemblyName = [Reflection.AssemblyName]::GetAssemblyName($dllPath)
            $fileVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($dllPath).FileVersion

            if ($assemblyName.Version -ne [Version]"2.34.0.0") {
              throw "Unexpected assembly version for ${dllPath}: $($assemblyName.Version)"
            }

            if ($fileVersion -ne "2.34.0.0") {
              throw "Unexpected file version for ${dllPath}: $fileVersion"
            }

            Write-Host "Verified $($assemblyName.Name), Version=$($assemblyName.Version), FileVersion=$fileVersion"
            Get-FileHash $dllPath -Algorithm SHA256 | Format-List
          }

      - name: Upload patch DLLs
        uses: actions/upload-artifact@v4
        with:
          name: LenovoLegionToolkit-current-state-upstream-da6be8ec
          path: |
            build-patch/LenovoLegionToolkit.Lib.dll
            build-patch/Lenovo Legion Toolkit.dll
          if-no-files-found: error
