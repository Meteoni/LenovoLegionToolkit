name: Build LLT replacement DLLs

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llt-replacement-dlls-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_SHA: c7e63484bafde60d3fbd843cd5d3d0b24aa3562c
  LLT_VERSION: 2.36.5.8

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout integrated source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify official release baseline
        run: |
          git fetch https://github.com/LenovoLegionToolkit-Team/LenovoLegionToolkit.git "refs/tags/v${env:LLT_VERSION}:refs/tags/official-replacement-baseline"
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the official release tag.' }
          $tagCommit = (git rev-parse 'official-replacement-baseline^{commit}').Trim()
          if ($tagCommit -ne $env:UPSTREAM_SHA) { throw 'Official release tag does not match the pinned upstream commit.' }
          git merge-base --is-ancestor $env:UPSTREAM_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Integrated source does not contain the pinned upstream commit.' }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Test DRR switching and Actions
        run: |
          dotnet run --project .github/tests/DrrRegression/DrrRegression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'DRR regression checks failed.' }

      - name: Build replacement DLLs from integrated source
        run: |
          dotnet publish LenovoLegionToolkit.WPF/LenovoLegionToolkit.WPF.csproj -c Release -o build-patch /p:DebugType=None /p:DebugSymbols=false /p:Version=$env:LLT_VERSION /p:AssemblyVersion=$env:LLT_VERSION /p:FileVersion=$env:LLT_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'DLL build failed.' }

      - name: Verify assembly identities and package DLLs
        run: |
          $artifactFolder = New-Item -ItemType Directory -Path replacement-dlls
          $checksums = @()
          $assemblies = @()
          foreach ($name in @('LenovoLegionToolkit.Lib.dll', 'Lenovo Legion Toolkit.dll')) {
            $path = Join-Path $PWD "build-patch/$name"
            $identity = [Reflection.AssemblyName]::GetAssemblyName($path)
            $fileVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($path).FileVersion
            if ($identity.Version.ToString() -ne $env:LLT_VERSION -or $fileVersion -ne $env:LLT_VERSION) {
              throw "Wrong assembly or file version for $name"
            }
            if ($identity.GetPublicKeyToken().Length -ne 0) { throw "Unexpected assembly signing identity for $name" }
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash
            $checksums += "$hash  $name"
            $assemblies += @{ name = $name; identity = $identity.FullName; fileVersion = $fileVersion; sha256 = $hash }
            Copy-Item -LiteralPath $path -Destination $artifactFolder
            Write-Host "$($identity.FullName), FileVersion=$fileVersion, SHA256=$hash"
          }
          $checksums | Set-Content replacement-dlls/SHA256SUMS.txt
          @{
            upstreamCommit = $env:UPSTREAM_SHA
            sourceCommit = $env:GITHUB_SHA
            version = $env:LLT_VERSION
            runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            assemblies = $assemblies
          } | ConvertTo-Json -Depth 4 | Set-Content replacement-dlls/BUILDINFO.json
          Copy-Item .github/REPLACEMENT-DLLS.md replacement-dlls/README.md

      - name: Upload replacement DLLs
        uses: actions/upload-artifact@v4
        with:
          name: LLT-2.36.5.8-replacement-DLLs-ITS-DRR-c7e63484
          path: replacement-dlls/*
          if-no-files-found: error
          retention-days: 90

      - name: Build summary
        run: |
          @"
          ## LLT replacement DLLs
          - Official baseline: $env:UPSTREAM_SHA
          - Assembly and file versions: $env:LLT_VERSION
          - Source: $env:GITHUB_SHA
          - Features: ITS startup restore toggle and configurable virtual/physical DRR pair, shared by dashboard and Actions.
          - Example: custom 50/100 Hz on battery; fixed 120 Hz on AC.
          - Validation: production DRR and Actions source regression checks plus assembly identities and SHA-256 checksums.
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
