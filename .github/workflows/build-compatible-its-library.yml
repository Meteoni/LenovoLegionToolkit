name: Build Compatible ITS Library

on:
  workflow_dispatch:
  push:
    branches:
      - its-startup-restore-toggle-2.36.1.18

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore application
        run: dotnet restore LenovoLegionToolkit.WPF/LenovoLegionToolkit.WPF.csproj

      - name: Publish compatible application assemblies
        run: dotnet publish LenovoLegionToolkit.WPF/LenovoLegionToolkit.WPF.csproj -c Release -o build-patch /p:DebugType=None /p:Version=2.36.1.18 /p:FileVersion=2.36.1.18

      - name: Verify assembly identities
        shell: powershell
        run: |
          $dllPaths = @(
            (Join-Path $PWD "build-patch/LenovoLegionToolkit.Lib.dll"),
            (Join-Path $PWD "build-patch/Lenovo Legion Toolkit.dll")
          )

          foreach ($dllPath in $dllPaths) {
            $assemblyName = [Reflection.AssemblyName]::GetAssemblyName($dllPath)
            $fileVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($dllPath).FileVersion

            if ($assemblyName.Version -ne [Version]"2.36.1.18") {
              throw "Unexpected assembly version for ${dllPath}: $($assemblyName.Version)"
            }

            if ($fileVersion -ne "2.36.1.18") {
              throw "Unexpected file version for ${dllPath}: $fileVersion"
            }

            Write-Host "Verified $($assemblyName.Name), Version=$($assemblyName.Version), FileVersion=$fileVersion"
          }

      - name: Upload patch DLLs
        uses: actions/upload-artifact@v4
        with:
          name: LenovoLegionToolkit-2.36.1.18-ITS-startup-toggle-full
          path: |
            build-patch/LenovoLegionToolkit.Lib.dll
            build-patch/Lenovo Legion Toolkit.dll
          if-no-files-found: error
